project:
  type: website
  output-dir: _site

listing:
  contents: posts
  sort: "date desc"
  categories: true
  feed:
    type: metadata  # makes it so that the feed includes the metadata and not the full posts. 
    categories:     
      - "math"
      - "art"  
      - "teaching"
      - "admin"
      - "misc"
      
website:
  title: "Insights by Christopher R. H. Hanusa"
  favicon: favicon.png
  site-url: "https://hanusa.xyz/blog"  # <--- This is required for RSS
  description: "Writings by Christopher R. H. Hanusa about math, art, coding, teaching, leadership, academia, and other miscellaneous topics"
  
  search:
    location: sidebar
    type: textbox
    
  navbar:
    title: false
    logo: "hanusa-xyz.png"       
    logo-href: https://hanusa.xyz 
    background: "white"  
    pinned: true             # fixed to the top, like the main site

    # "right" items appear on the far right side
    right:
      - text: "Research"
        href: https://hanusa.xyz/research.html
      - text: "Design"
        href: https://hanusa.xyz/design.html
      - text: "Education"
        href: https://hanusa.xyz/education.html
      - text: "Strategy"
        href: https://hanusa.xyz/strategy.html
      - text: "Insights"
        href: https://hanusa.xyz/blog/
      - text: "Contact"
        href: https://hanusa.xyz/contact.html

  sidebar:
    search: true
    contents:
      - text: "All posts"     # <--- This creates the link below search
        href: index.qmd
      - auto: "posts/**/*.qmd" # folder names are YYYY-MM-DD-slug, so this sorts chronologically

  # prev/next post buttons at the bottom of each post (ordered by the sidebar above)
  page-navigation: true

  # button to jump back to the top of long posts
  back-to-top-navigation: true

  page-footer:
    center:
      - text: "← All posts"
        href: index.qmd
      - text: "hanusa.xyz"
        href: https://hanusa.xyz
format:
  html:
    include-in-header:
      text: |
        <script data-goatcounter="https://hanusaxyz.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>
    toc: true
    toc-location: left
    toc-title: "Contents" # Fallback if title is missing
    css: blog_styles.css
    code-copy: true       # always show the copy button on code blocks
    lightbox: true        # click any image to view it in a lightbox
